<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THT Segment Publisher</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f5f4f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}h1{margin:0;font-size:30px}p{color:#666}.card{background:#fff;border:1px solid #ddd9cf;border-radius:16px;padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric b{font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.btn,input,textarea{font:inherit}
button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#222;color:white;cursor:pointer;text-decoration:none}.secondary{background:#ece9e1;color:#222}
input,textarea{width:100%;padding:10px;border:1px solid #d6d2c8;border-radius:9px;background:#fff}label{display:block;font-size:12px;color:#666;margin:8px 0 4px}
.segment{display:grid;grid-template-columns:1fr 140px;gap:16px}.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font-size:12px;padding:4px 8px;border-radius:99px;background:#eee;display:inline-block}
#msg{min-height:24px;color:#555}@media(max-width:700px){.grid{grid-template-columns:1fr}.segment{grid-template-columns:1fr}header{display:block}}
</style></head><body><div class="wrap">
<header><div><h1>THT Segment Publisher</h1><p>Capture → detect → trim → export for iono.fm channel 7560</p></div><span class="status">MVP</span></header>
<section class="card"><h2>Automation settings</h2><p>Set the direct playable Smile FM stream URL and the THT recording schedule. Times use Africa/Johannesburg.</p>
<label>Direct stream URL</label><input id="stream" placeholder="https://…">
<div class="times"><div><label>Days</label><input id="days" value="mon,tue,wed,thu,fri"></div><div><label>Start time (24h)</label><input id="time" type="time" value="18:00"></div></div>
<div class="times"><div><label>Recording length (minutes)</label><input id="mins" type="number" min="1" max="240" value="120"></div><div><label>Scheduled capture</label><select id="enabled" style="width:100%;padding:10px;border:1px solid #d6d2c8;border-radius:9px"><option value="false">Off</option><option value="true">On</option></select></div></div>
<div class="actions" style="margin-top:12px"><button id="saveSettings">Save schedule</button></div></section><section class="card"><h2>New broadcast</h2><div class="actions">
<label class="btn">Upload full show<input id="file" type="file" accept="audio/*" hidden></label>
<button id="record">Record 2 hours from Smile FM</button></div><p id="msg">Ready.</p></section>
<section id="summary" class="grid"></section><section id="work"></section>
</div><script>
let current=null;
const $=s=>document.querySelector(s), msg=t=>$("#msg").textContent=t;
function fmt(x){x=Math.max(0,Number(x)||0);let m=Math.floor(x/60),s=Math.floor(x%60);return m+":"+String(s).padStart(2,"0")}
async function load(s){current=s;$("#summary").innerHTML=`<div class="card metric"><p>Broadcast</p><b>${s.created.slice(0,10)}</b></div><div class="card metric"><p>Segments</p><b>${s.segments.length}</b></div><div class="card metric"><p>Duration</p><b>${fmt(s.duration)}</b></div>`;render()}
function render(){let w=$("#work");w.innerHTML="<h2>Detected segments</h2>";current.segments.forEach((x,i)=>{let d=document.createElement("article");d.className="card segment";d.innerHTML=`<div><span class="status">${x.status}</span><label>Title</label><input data-k="title" value="${esc(x.title)}"><label>Guest</label><input data-k="guest" value="${esc(x.guest||"")}"><label>Description</label><textarea data-k="description" rows="3">${esc(x.description||"")}</textarea><div class="times"><div><label>IN (seconds)</label><input data-k="start" type="number" step=".1" value="${x.start}"></div><div><label>OUT (seconds)</label><input data-k="end" type="number" step=".1" value="${x.end}"></div></div><p>${fmt(x.start)} → ${fmt(x.end)} · ${fmt(x.end-x.start)}</p></div><div class="actions"><button class="save secondary">Save changes</button><button class="export">Prepare for iono</button><a class="btn secondary" target="_blank" href="/publish/${current.id}/${x.id}">Open iono handoff</a></div>`;d.querySelector(".save").onclick=()=>save(x,d);d.querySelector(".export").onclick=()=>exp(x,d);w.appendChild(d)})}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
async function save(x,d){let body={};d.querySelectorAll("[data-k]").forEach(e=>body[e.dataset.k]=e.type==="number"?Number(e.value):e.value);let r=await fetch(`/api/shows/${current.id}/segments/${x.id}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok){msg(await r.text());return}Object.assign(x,await r.json());msg("Changes saved.");render()}
async function exp(x,d){await save(x,d);msg("Rendering normalized MP3…");let r=await fetch(`/api/shows/${current.id}/segments/${x.id}/export`,{method:"POST"});if(!r.ok){msg(await r.text());return}let j=await r.json();window.location=j.download;msg("Publication package exported.")}
$("#file").onchange=async e=>{if(!e.target.files[0])return;msg("Uploading and processing…");let f=new FormData();f.append("file",e.target.files[0]);let r=await fetch("/api/upload",{method:"POST",body:f});if(!r.ok){msg(await r.text());return}await load(await r.json());msg("Processing complete. Review segment boundaries.")}
$("#record").onclick=async()=>{if(!confirm("Start a two-hour recording from the public Smile FM stream now? Keep this page open until the request completes."))return;msg("Recording live stream…");let r=await fetch("/api/record",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({seconds:7200})});if(!r.ok){msg(await r.text());return}await load(await r.json());msg("Recording processed. Review segment boundaries.")}

async function loadSettings(){let c=await fetch("/api/settings").then(r=>r.json());$("#stream").value=c.stream_url||"";$("#days").value=c.days;$("#time").value=String(c.hour).padStart(2,"0")+":"+String(c.minute).padStart(2,"0");$("#mins").value=Math.round(c.duration/60);$("#enabled").value=String(c.enabled)}
$("#saveSettings").onclick=async()=>{let [h,m]=$("#time").value.split(":").map(Number);let body={stream_url:$("#stream").value.trim(),days:$("#days").value.trim().toLowerCase(),hour:h,minute:m,duration:Number($("#mins").value)*60,enabled:$("#enabled").value==="true"};let r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});msg(r.ok?"Schedule saved.":await r.text())}
loadSettings();

fetch("/api/shows").then(r=>r.json()).then(x=>{if(x[0])load(x[0])});
</script></body></html>
